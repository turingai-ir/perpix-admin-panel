x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  perpix-admin-panel:
    image: perpix-admin-panel:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PNPM_VERSION: ${PNPM_VERSION:-11.4.0}
        PACKAGE_REGISTRY: ${PACKAGE_REGISTRY:-https://registry.npmjs.org}
        VITE_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${VITE_OBJECT_STORAGE_PUBLIC_ENDPOINT:-https://cdn.perpixai.ir}
        VITE_PERPIX_API_URL: ${VITE_PERPIX_API_URL}
        VITE_PERPIX_ADMIN_URL: ${VITE_PERPIX_ADMIN_URL}
        VITE_PERPIX_APP_URL: ${VITE_PERPIX_APP_URL:-https://app.perpixai.ir}
        VITE_APP_FONT_BASE_URL: ${VITE_APP_FONT_BASE_URL:-/fonts}
        VITE_PERPIX_MAIN_URL: ${VITE_PERPIX_MAIN_URL:-https://perpixai.ir}
    ports:
      - "${PERPIX_ADMIN_PORT:-5175}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.20"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped
    pull_policy: build
    networks:
      - perpix

networks:
  perpix:
    external: true
